aid: aftership
url: https://raw.githubusercontent.com/api-evangelist/aftership/refs/heads/main/apis.yml
name: AfterShip
kind: company
description: AfterShip is a post-purchase experience platform for ecommerce brands, retailers, marketplaces and 3PLs, founded in 2012 and headquartered
  in Hong Kong. Its products cover shipment tracking across 1,400+ carriers, branded tracking pages, AI-predicted estimated delivery dates, automated
  returns and exchanges, warranty and claims management, shipping-label generation and rate shopping (Postmen), shipment protection, address validation,
  AI email parsing, product personalization and discovery, and marketplace feed management. AfterShip publishes ten versioned, date-based REST
  APIs on api.aftership.com, each with a downloadable OpenAPI 3.1 description, seven first-party SDKs, webhooks, an OAuth 2.0 authorization server,
  and public and OAuth-gated MCP servers for AI agents.

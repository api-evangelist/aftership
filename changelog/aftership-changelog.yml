entries:
- version: 2026-07
  date: '2026-07-09'
  api: AfterShip Tracking API
  breaking:
  - change: Base URL moves from https://api.aftership.com/tracking/2026-01 to https://api.aftership.com/tracking/2026-07
  - change: as-api-version header value moves from 2026-01 to 2026-07
  additions:
  - '10 new delivery sub-statuses: Delivered_005, Exception_016 through Exception_021, InTransit_011, InTransit_012,
    InTransit_013'
  - New field shipment_dimensions on the tracking object (length, width, height)
  - New field checkpoints[].hash — a unique per-checkpoint identifier for deduplication
  - New field customers[].id — the customer identifier on the merchant or platform side (readable and writable)
  - New field proof_of_delivery — array of POD records (signature or photo); returns a value only once the feature
    is enabled
  - New field multi_piece_info — multi-piece shipment metadata; returns a value only on plans that include multi-piece
  - New field shipment_direction — forward (outbound-to-customer) or return (customer-to-merchant); readable and
    writable
  - New field return_shipment — the linked return shipment when shipment_direction is forward
  - New field forward_shipment — the original outbound shipment when shipment_direction is return
  affected:
  - GET /trackings
  - GET /trackings/:id
  - DELETE /trackings/:id
  - POST /trackings
  - PUT /trackings/:id
  - POST /trackings/:id/mark-as-completed
  - POST /trackings/:id/retrack
  - Tracking Webhook

description: 'Entity-relationship graph derived from the $ref links and id-reference fields in the ten published AfterShip OpenAPI documents. Ten independent product APIs share one post-purchase spine: a Tracking record is the hub, and Returns, Warranty claims, Protection coverages and Shipping labels all attach to shipments by tracking number or shipment identifier rather than by a single global foreign key.'
entity_count: 137
relationship_count: 169
core_domains:
- domain: Tracking
  root: Tracking
  children:
  - Checkpoint
  - Courier
  - CourierConnection
  note: Tracking is the platform hub. As of 2026-07 it carries shipment_direction plus return_shipment / forward_shipment links, which is the explicit join between outbound and return legs.
- domain: Returns
  root: Return
  keys:
  - return_id
  - rma_number
  note: 'Every Returns operation is dual-addressed: the same action exists once keyed on return_id and once on rma_number.'
- domain: Shipping (Postmen)
  root: Label
  children:
  - Rate
  - Manifest
  - Pickup
  - ShipperAccount
  note: Shipper accounts hold carrier credentials; rates, labels, manifests and pickups all reference a shipper account.

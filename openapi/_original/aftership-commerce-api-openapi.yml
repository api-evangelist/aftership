                        slug: usps
                        service_type: standard shipping
                        ship_date: '2023-05-04'
                        custom_fields: {}
                        next_couriers:
                        - tracking_number: RA123456789US
                          slug: usps
                      pickup_info:
                        instructions: Shop open from Mon to Fri
                        estimated_ready_for_pickup_at:
                          min: '2021-04-15T20:02:09Z'
                          max: '2021-04-15T20:02:09Z'
                        pickup_deadline_at: '2021-04-15T20:02:09Z'
      description: 'Updating the fulfillment status by fulfillment ID.


        ## Status Updating Sequence


        The fulfillment status must be updated in a specific sequence according to the fullfilment delivery method (`fulfillment.delivery_method`).


        For `shipping` fulfillment, the statuses should be updated in the following order:


        > `pending` → `processing` → `shipped` → `canceled`


        **Note:** Updating the status in reverse, such as updating from `shipped` to `processing`, **is not permitted**.


        Similarly, for `pickup` fulfillment, the statuses should be updated in the following order:


        > `pending` → `processing` → `ready_for_pickup` → `picked_up` → `canceled`


        ## Custom Status


        The provided status sequences do not include any custom statuses. For custom statuses, please adhere to the sequence configured in the AfterShip Admin Portal.


        Ensure that statuses are updated in the prescribed order to avoid any discrepancies.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  status: custom-status
              required:
              - status
              - occurred_at
              properties:
                status:
                  type: string
                  x-stoplight:
                    id: caaaa22j8prpm
                  description: "The status of the fulfillment. Depending of on the `delivery_method`, the allowed values are different.\n\nAllowed values: \n\ndelivery_method is shipping:\n`pending`, `processing`, `shipped`, `canceled`, and the custom defined statuses.\n\ndelivery_method is pickup:\n`pending`, `processing`, `ready_for_pickup`, `picked_up`, `canceled`, and the custom defined statuses."
                  example: pending
                occurred_at:
                  type: string
                  x-stoplight:
                    id: mgkf5gceepa4k
                  format: date-time
                  description: Indicates the time the status was updated, showing when the Doege occurred for the fulfillment, formatted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601).
                  example: '2021-04-15T20:02:09Z'
            examples:
              Example 1:
                value:
                  status: pending
                  occurred_at: '2021-04-15T20:02:09Z'
        description: ''
      x-internal: false
      parameters:
      - $ref: '#/components/parameters/as-store-id'
      tags:
      - Fulfillments

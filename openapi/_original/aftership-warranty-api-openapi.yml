  /claims/{claim_id}/match-resolution:
    parameters:
    - name: claim_id
      in: path
      required: true
      description: The unique identifier of the claim.
      schema:
        type: string
      example: 102a899f79c82422c99b1fdc417e01010
    post:
      tags:
      - Claims
      summary: Check claim resolution availability
      operationId: check-claim-resolution-availability
      description: Checks which resolution methods are supported by a claim and which stores can be used for processing.
      responses:
        '200':
          description: The supported resolution methods and available stores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta_20000'
                  data:
                    type: object
                    properties:
                      resolutions:
                        type: array
                        items:
                          type: object
                          properties:
                            resolution_method:
                              type: string
                              description: The public resolution method.
                              enum:
                              - repair_item
                              - replace_item
                              - send_repair_kit
                              - issue_store_credit
                              - other
                            supported:
                              type: boolean
                              description: Whether AfterShip can create the corresponding e-commerce platform resource for this resolution method, such as a replacement order or store credit.
                            stores:
                              type: array
                              description: Stores that can be used when processing this resolution method.
                              items:
                                type: object
                                description: The brief information of the store associated with the original order.
                                properties:
                                  platform:
                                    type: string
                                    description: The e-commerce platform where the store is located.
                                    enum:
                                    - shopify
                                    - bigcommerce
                                    - woocommerce
                                    example: shopify
                                  external_id:
                                    type: string
                                    description: The identifier of the store on the e-commerce platform.
                                    example: cool-shoe-store
              example:
                meta:
                  code: 20000
                  type: OK
                  message: The request was successfully processed by AfterShip.
                data:
                  resolutions:
                  - resolution_method: repair_item
                    supported: true
                    stores: []
                  - resolution_method: replace_item
                    supported: true
                    stores:
                    - platform: shopify
                      external_id: cool-shoe-store
                  - resolution_method: send_repair_kit
                    supported: true
                    stores:
                    - platform: shopify
                      external_id: cool-shoe-store
                  - resolution_method: issue_store_credit
                    supported: true
                    stores:
                    - platform: shopify
                      external_id: cool-shoe-store
                  - resolution_method: other
                    supported: true
                    stores: []
  /claims/{claim_id}/process:
    parameters:
    - name: claim_id
      in: path
      required: true
      description: The unique identifier of the claim.
      schema:
        type: string
      example: 102a899f79c82422c99b1fdc417e01010
    post:
      tags:
      - Claims
      summary: Process a claim
      operationId: process-claim
      description: 'Processes an approved claim and returns the updated Claim resource. Allowed source status: approved.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_customer:
                  type: boolean
                  description: Whether to notify the customer about the claim processing update.
                items:
                  type: array
                  description: Claim items to process.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The unique identifier of the claim item.
                      resolution_method:
                        type: string
                        description: The public resolution method to apply to this item.
                        enum:
                        - repair_item
                        - replace_item
                        - send_repair_kit
                        - issue_store_credit
                        - other
                      process_item_details:
                        type:
                        - string
                        - 'null'
                        maxLength: 1000
                        description: Optional merchant-facing processing note. Maximum length is 1000 characters.
                      replacement_order:
                        type: object
                        description: Replacement order payload for replace_item or send_repair_kit resolutions. Use a store returned by the match-resolution endpoint.
                        properties:
                          store:
                            type: object
                            description: The store selected from POST /claims/{claim_id}/match-resolution.
                            properties:
                              platform:
                                type: string
                                description: The e-commerce platform where the store is located.
                                enum:
                                - shopify
                                - bigcommerce
                                - woocommerce
                                example: shopify
                              external_id:
                                type: string
                                description: The identifier of the store on the e-commerce platform.
                                example: cool-shoe-store
                            required:
                            - platform
                            - external_id
                          items:
                            type: array
                            description: Replacement order item selections.
                            items:
                              type: object
                              properties:
                                external_product_id:
                                  type: string
                                  description: The e-commerce platform product identifier for the replacement item.
                                external_variant_id:
                                  type: string
                                  description: The e-commerce platform variant identifier for the replacement item.
                                quantity:
                                  type: integer
                                  minimum: 1
                                  description: The replacement quantity.
                              required:
                              - external_product_id
                              - external_variant_id
                              - quantity
                        required:
                        - store
                        - items
                      store_credit:
                        type: object
                        description: Store credit payload for issue_store_credit resolution. Use a store returned by the match-resolution endpoint when store selection is required.
                        properties:
                          store:
                            type: object
                            description: The store selected from POST /claims/{claim_id}/match-resolution.
                            properties:
                              platform:
                                type: string
                                description: The e-commerce platform where the store is located.
                                enum:
                                - shopify
                                - bigcommerce
                                - woocommerce
                                example: shopify
                              external_id:
                                type: string
                                description: The identifier of the store on the e-commerce platform.
                                example: cool-shoe-store
                            required:
                            - platform
                            - external_id
                          value:
                            $ref: '#/components/schemas/Money'
                            description: The store credit value.
                        required:
                        - value
                    required:
                    - id
                    - resolution_method
              required:
              - items
            examples:
              replace_item:
                summary: Create a replacement order
                value:
                  notify_customer: true
                  items:
                  - id: c83fd9f0c4e343de9d21fbf0acf5ebd9
                    resolution_method: replace_item
                    process_item_details: Create replacement order from API.
                    replacement_order:
                      store:
                        platform: shopify
                        external_id: cool-shoe-store
                      items:
                      - external_product_id: '45234123'
                        external_variant_id: '45234124'
                        quantity: 1
              issue_store_credit:
                summary: Issue store credit
                value:
                  notify_customer: true
                  items:
                  - id: c83fd9f0c4e343de9d21fbf0acf5ebd9
                    resolution_method: issue_store_credit
                    store_credit:
                      store:
                        platform: shopify
                        external_id: cool-shoe-store
                      value:
                        amount: '25.00'
                        currency: USD
              other:
                summary: Process with other resolution
                value:
                  notify_customer: false
                  items:
                  - id: c83fd9f0c4e343de9d21fbf0acf5ebd9
                    resolution_method: other
                    process_item_details: Handled outside AfterShip Warranty.
      responses:
        '200':
          description: The updated Claim resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta_20000'
                  data:
                    $ref: '#/components/schemas/Claim'
              example:
                meta:
                  code: 20000
                  type: OK
                  message: The request was successfully processed by AfterShip.
                data:
                  id: 102a899f79c82422c99b1fdc417e01010
                  rma_number: RMA-1001
                  status: in_process
                  process_at: '2026-05-19T10:03:00Z'
                  updated_at: '2026-05-19T10:03:00Z'
  /claims/{claim_id}/shipments:
    parameters:
    - name: claim_id
      in: path
      required: true
      description: The unique identifier of the claim.
      schema:
        type: string
      example: 102a899f79c82422c99b1fdc417e01010
    post:
      tags:
      - Claim Shipments
      summary: Create a claim shipment
      operationId: create-claim-shipment
      description: 'Creates one inbound or outbound shipment for a claim. Allowed source statuses: approved, in_process. AfterShip labels are generated asynchronously; use GET /claims/{claim_id}/shipments/{shipment_id} to poll the result.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - title: AfterShip generated label
                type: object
                properties:
                  shipment_direction:
                    type: string
                    description: The claim shipment direction. AfterShip-generated labels currently support inbound shipments only.
                    enum:
                    - inbound
                  notify_customer:
                    type: boolean
                    description: Whether to notify the customer about the shipment.
                  label_source:
                    type: string
                    description: Use aftership for AfterShip-generated labels.
                    enum:
                    - aftership
                required:
                - shipment_direction
                - label_source
              - title: Merchant provided label and tracking
                type: object
                properties:
                  shipment_direction:
                    type: string
                    description: The claim shipment direction.
                    enum:
                    - inbound
                    - outbound
                  notify_customer:
                    type: boolean
                    description: Whether to notify the customer about the shipment.
                  label_source:
                    type: string
                    description: Use merchant to submit merchant-provided label and tracking information.
                    enum:
                    - merchant
                  label:
                    type: object
                    description: The shipment label information.
                    properties:
                      url:
                        type: string
                        description: The label URL.
                        example: https://example.com/label.pdf
                    required:
                    - url
                  tracking_slug:
                    type: string
                    description: The tracking slug.
                    example: ups
                  tracking_number:
                    type: string
                    description: The tracking number.
                    example: 1Z999
                required:
                - shipment_direction
                - label_source
                - label
                - tracking_slug
                - tracking_number
            examples:
              auto_inbound_label:
                summary: Generate inbound label with AfterShip
                value:
                  shipment_direction: inbound
                  notify_customer: true
                  label_source: aftership
              manual_inbound_label:
                summary: Upload inbound label manually
                value:
                  shipment_direction: inbound
                  notify_customer: true
                  label_source: merchant
                  label:
                    url: https://example.com/label.pdf
                  tracking_slug: ups
                  tracking_number: 1Z999
              manual_outbound_label:
                summary: Upload outbound label manually
                value:
                  shipment_direction: outbound
                  notify_customer: true
                  label_source: merchant
                  label:
                    url: https://example.com/label.pdf
                  tracking_slug: ups
                  tracking_number: 1Z999
      responses:
        '201':
          description: The created ClaimShipment resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta_20000'
                  data:
                    $ref: '#/components/schemas/Claim_shipment'
              examples:
                creating:
                  summary: Auto label is creating
                  value:
                    meta:
                      code: 20000
                      type: OK
                      message: The request was successfully processed by AfterShip.
                    data:
                      id: shipment_id
                      label:
                        url: null
                        invoice_url: null
                        qrcode: null
                      tracking_number: null
                      tracking_slug: null
                      tracking_status: null
                      tracking_status_updated_at: null
                      item_selections: []
                      ship_from: null
                      ship_to: null
                      created_at: '2026-05-19T10:00:00Z'
                      updated_at: '2026-05-19T10:00:00Z'
                created:
                  summary: Manual label created
                  value:
                    meta:
                      code: 20000
                      type: OK
                      message: The request was successfully processed by AfterShip.
                    data:
                      id: shipment_id
                      label:
                        url: https://files.example.com/warranty/label.pdf
                        invoice_url: null
                        qrcode: null
                      tracking_number: 1Z999
                      tracking_slug: ups
                      tracking_status: Pending
                      tracking_status_updated_at: '2026-05-19T10:03:00Z'
                      item_selections: []
                      ship_from: null

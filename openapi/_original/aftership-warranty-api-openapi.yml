openapi: 3.1.0
info:
  title: API Overview
  version: 2026-07
  summary: API Overview
  description: '> OAS Schema can be downloaded [here](https://stoplight.io/api/v1/projects/automizely/docs-prod-wt-public/nodes/reference/api.json?branch=master&deref=optimizedBundle)'
  contact:
    name: AfterShip Support
    url: https://www.aftership.com/contact-us
    email: support@aftership.com
  termsOfService: https://www.aftership.com/legal/terms-of-service
servers:
- url: https://api.aftership.com/warranty/2026-07
  description: API Endpoint
tags:
- name: Warranty Registrations
  description: Public endpoints for querying and correcting warranty registration data.
- name: Claims
  description: Public endpoints for querying and operating claims.
- name: Claim Shipments
  description: Public endpoints for creating and polling claim shipment resources.
- name: Item Tags
  description: Public endpoints for reading item tags that can be applied to claim items.
- name: Claim Items
  description: Public endpoints for updating item-level claim data.
security:
- ApiKeyAuth: []
paths:
  /claims:
    get:
      tags:
      - Claims
      summary: List claims
      operationId: list-claims
      description: Lists claims for external systems to sync and decide which RMA to inspect or operate next.
      parameters:
      - name: keyword
        in: query
        required: false
        description: Free-text search across searchable claim, order, customer, and item fields.
        schema:
          type: string
        example: RMA-1001
      - name: statuses
        in: query
        required: false
        description: 'Comma-separated claim status values to include. Each value must be one of: under_review, approved, in_process, completed, rejected, canceled.'
        schema:
          type: string
        example: approved,in_process
      - name: claim_created_at_min
        in: query
        required: false
        description: Inclusive lower bound for claim creation time. The date and time, formatted in ISO 8601. Please make sure the value of the parameter is properly escaped in URL encoding.
        schema:
          type: string
          format: date-time
        example: '2026-05-19T10:00:00Z'
      - name: claim_created_at_max
        in: query
        required: false
        description: Exclusive upper bound for claim creation time. The date and time, formatted in ISO 8601. Please make sure the value of the parameter is properly escaped in URL encoding.
        schema:
          type: string
          format: date-time
        example: '2026-05-19T10:00:00Z'
      - name: order_created_at_min
        in: query
        required: false
        description: Inclusive lower bound for order creation time. The date and time, formatted in ISO 8601. Please make sure the value of the parameter is properly escaped in URL encoding.
        schema:
          type: string
          format: date-time
        example: '2026-05-19T10:00:00Z'
      - name: order_created_at_max
        in: query
        required: false
        description: Exclusive upper bound for order creation time. The date and time, formatted in ISO 8601. Please make sure the value of the parameter is properly escaped in URL encoding.
        schema:
          type: string
          format: date-time
        example: '2026-05-19T10:00:00Z'
      - name: resolution_methods
        in: query
        required: false
        description: 'Comma-separated public resolution method values to include. Each value must be one of: repair_item, replace_item, send_repair_kit, issue_store_credit, other.'
        schema:
          type: string
        example: replace_item,repair_item
      - name: warranty_page_ids
        in: query
        required: false
        description: Comma-separated 32-character warranty page IDs.
        schema:
          type: string
        example: 11111111111111111111111111111111,22222222222222222222222222222222
      - name: page
        in: query
        required: false
        description: Page number. page * limit must be less than or equal to 10000.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        description: Number of claims per page. page * limit must be less than or equal to 10000.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        example: 10
      responses:
        '200':
          description: A paginated list of claim resources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta_20000'
                  data:
                    type: object
                    properties:
                      claims:
                        type: array
                        items:
                          $ref: '#/components/schemas/Claim'
                        description: The full Claim resources matching the query.
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: Total number of claims matching the query.
                          page:
                            type: integer
                            description: Current page number.
                          limit:
                            type: integer
                            description: Number of claims per page.
                          has_next_page:
                            type: boolean
                            description: Whether another page is available.
              example:
                meta:
                  code: 20000
                  type: OK
                  message: The request was successfully processed by AfterShip.
                data:
                  claims:
                  - id: 102a899f79c82422c99b1fdc417e01010
                    note: null
                    approval_note: null
                    warranty_page:
                      id: 006b053d93564aaab58f95c0a90e06eb
                      name: Default warranty page
                    items:
                    - id: c83fd9f0c4e343de9d21fbf0acf5ebd9
                      source_id: '13501508419800'
                      title: School Bags
                      product_title: School Bags
                      variant_title: '02'

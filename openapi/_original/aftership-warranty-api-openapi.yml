                  value:
                    meta:
                      code: 20000
                      type: OK
                      message: The request was successfully processed by AfterShip.
                    data:
                      id: shipment_id
                      label:
                        url: https://files.example.com/warranty/label.pdf
                        invoice_url: null
                        qrcode: null
                      tracking_number: 1Z999
                      tracking_slug: ups
                      tracking_status: Pending

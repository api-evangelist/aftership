          example: '2026-05-19T10:00:00Z'
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time, formatted in ISO 8601, when the claim was approved.
          example: '2026-05-19T10:00:00Z'
        canceled_at:
          type:
          - string
          - 'null'

          type: string
          minLength: 1
          enum:
          - unsubmitted
          - submitted
          - under_review
          - approved
          - paid
          - closed
          - denied
          - waiting_on_documents
          description: claim status
        resolve_status:
          type: string
          minLength: 1
          enum:
          - precheck
          - to_be_resolved
          - denied
          - resolved

          minLength: 1
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          description: created time in ISO8601 format
          example: '2023-03-13T08:16:40.207Z'
        updated_at:
          type: string
          minLength: 1
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          description: updated time in ISO8601 format
          example: '2023-08-15T03:40:12.628Z'
        issue_type:
          type: string
          enum:
          - lost_in_transit
          - porch_pirated
          - damaged
          description: type of issue for the claim
        issue_desc:
          type: string
          description: description of the issue
        issue_commodity:
          type: string
          description: the category of the claimed items
        claim_items:
          type: array
          description: items being claimed
          items:
            $ref: '#/components/schemas/Order_item.v1'
        claim_items_amount:
          $ref: '#/components/schemas/Amount.v1'
        shipping_amount:
          $ref: '#/components/schemas/Amount.v1'
        claim_submit_amount:
          $ref: '#/components/schemas/Amount.v1'
        uploaded_documents:
          type: array
          description: supporting documents
          items:
            type: object

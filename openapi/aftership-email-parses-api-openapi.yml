                    value: <CAasdfzM=ATfHsacasdfDO6o-xTOwnbasdfqwerqweradsVyasdfxzfQ@mail.gmail.com>
                  - name: From
                    value: xxxxx-xxxxx-xxxx@yyy.zzzzz
                  - name: Subject

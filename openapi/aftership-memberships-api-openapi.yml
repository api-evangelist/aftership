components:
  schemas:
    Role.v1:
      description: Object describes role information.
      type: object
      x-examples:
        example-1:
          code: admin
          name: Admin
      examples: []
      title: Role
      properties:
        code:
          type: string
          minLength: 1
          description: role code
        name:
          type: string
          minLength: 1
          description: role name
      required:
      - code
      - name
      x-tags:
      - Resource
    Pagination.v1:
      description: Pagination data
      type: object
      x-examples:
        example-1:
          page: 1
          limit: 10
          total: 9734043
      title: Pagination
      examples: []
      properties:
        page:
          type: number
          minimum: 1
        limit:
          type: number
          minimum: 1
          maximum: 200
          default: 100
        total:
          type: number
      required:
      - page
      - limit
      - total
      x-tags:
      - Envelope
    Meta.v1:
      description: Meta data object.
      type: object
      x-examples: {}
      examples:
      - code: 200
        type: OK
        message: Everything worked as expected.
      title: Meta
      x-tags:
      - Envelope
      properties:
        code:
          type: number
          default: 200
          example: 200
        type:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error.v1'
      required:
      - code
      - type
      - message
    Error.v1:
      type: object
      title: Error
      description: Each error object contains a "path" key and an "info" key. The "path" is the JSON path of the request object to indicate the error location. The "info" is a human-readable description of the error.
      examples:
      - path: account.email
        info: account.email is invalid
      additionalProperties: false
      x-tags:
      - Envelope
      properties:
        path:
          type: string
          description: The json path of the request object to indicate the error location
          example: account.email
        info:
          type: string
          description: A human-readable description of the error.
          example: account.email is invalid
    Membership.v1:
      description: Object describes membership information.
      type: object
      x-examples:
        example-1:
          id: 3ea1910b07394a95bf7cdaa611d3cc3f
          organization:
            id: 511ceb52969b400a93e3422c743ae34a
          account:
            id: 74d998151a1b4668bee5a283712dd57e
            email: example@mydomain.com
          role:
            code: admin
            name: Admin
      examples: []
      title: Membership
      x-tags:
      - Resource
      properties:
        id:
          type: string
          minLength: 1
        organization:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
        account:
          type: object
          required:
          - id
          - email
          properties:
            id:
              type: string
              minLength: 1
              description: Identity of account.
            email:
              type: string
              minLength: 1
              description: Email ID, which should be registered with AfterShip already.
        role:
          $ref: '#/components/schemas/Role.v1'
      required:
      - id
      - organization
      - account
      - role
  securitySchemes:
    as-api-key:
      name: as-api-key
      type: apiKey
      in: header

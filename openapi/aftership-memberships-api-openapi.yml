openapi: 3.2.0
info:
  title: Overview Memberships API
  version: '1.0'
  contact:
    name: AfterShip Support
    url: https://www.aftership.com/contact-us
    email: support@aftership.com
  description: '> OAS Schema can be downloaded [here](https://stoplight.io/api/v1/projects/automizely/docs-api-aftership-com-admin-organization/nodes/reference/api.v1.json?branch=master&deref=optimizedBundle)'
  termsOfService: https://www.aftership.com/legal/terms-of-service
  summary: API Overview
servers:
- url: https://api.aftership.com/admin/2022-01
  description: API Endpoint
security:
- as-api-key: []
tags:
- name: Memberships
paths:
  /memberships:
    parameters: []
    get:
      summary: Get memberships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
                    properties:
                      memberships:
                        type: array
                        items:
                          $ref: '#/components/schemas/Membership.v1'
                      pagination:
                        $ref: '#/components/schemas/Pagination.v1'
                      parameter_string:
                        type: string
              examples:
                OK:
                  value:
                    meta:
                      code: 200
                      type: OK
                      message: Everything worked as expected.
                    data:
                      memberships:
                      - id: 4a6091f28bf645a09246899722ce8a21
                        organization:
                          id: 511ceb52969b400a93e3422c743ae34a
                        account:
                          id: 74d998151a1b4668bee5a283712dd57e
                          email: example@mydomain.com
                        role:
                          code: admin
                          name: Admin
                      pagination:
                        page: 1
                        limit: 100
                        total: 1
                      parameter_string: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
              examples:
                Unauthorized:
                  value:
                    meta:
                      code: 401
                      type: Unauthorized
                      message: The API key is invalid.
                    data: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
              examples:
                InternalError:
                  value:
                    meta:
                      code: 500
                      type: InternalError
                      message: Something went wrong on AfterShip's end.  Also, some error that cannot be retried happened on an external system that this call relies on.
                    data: {}
      operationId: get-memberships
      description: Return a list of the memberships.
      parameters:
      - schema:
          type: string
        in: query
        name: email
        description: account email
      - schema:
          type: string
        in: query
        name: page
        description: page index
      - schema:
          type: string
        in: query
        name: limit
        description: page size
      tags:
      - Memberships
    post:

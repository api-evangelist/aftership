                      type: Unauthorized
                      message: The API key is invalid.
                    data: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
              examples:
                Conflict:
                  value:
                    meta:
                      code: 409
                      type: Conflict
                      message: The request conflicts with another request (perhaps due to using the same idempotent key).
                    data: {}
        '422':
          description: Unprocessable Entity (WebDAV)
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
              examples:
                UnprocessableEntity:
                  value:
                    meta:
                      code: 422
                      type: UnprocessableEntity
                      message: The data given in the request failed validation. Inspect the response for details.
                      errors:
                      - path: account.email
                        info: account.email is invalid
                    data: {}
                AccountNotExist:
                  value:
                    meta:
                      code: 10001
                      type: UnprocessableEntity
                      message: The account with the given email does not exist in the system.
                    data: {}
                RoleNotExist:
                  value:
                    meta:
                      code: 10002
                      type: UnprocessableEntity
                      message: Role does not exist.
                    data: {}
                NoAvailableMemberSeats:
                  value:
                    meta:
                      code: 10003
                      type: UnprocessableEntity
                      message: No available member seats.
                    data: {}
                AccountEmailUnverified:
                  value:
                    meta:
                      code: 10004
                      type: UnprocessableEntity
                      message: Account email is unverified.
                    data: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta.v1'
                  data:
                    type: object
              examples:
                InternalError:
                  value:
                    meta:
                      code: 500
                      type: InternalError
                      message: Something went wrong on AfterShip's end.  Also, some error that cannot be retried happened on an external system that this call relies on.
                    data: {}
      description: Create a new membership
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  account:
                    email: example@mydomain.com
                  role:
                    code: admin
              properties:
                account:
                  type: object
                  required:
                  - email
                  properties:
                    email:
                      type: string
                      minLength: 1
                      description: Email ID, which should be registered with AfterShip already.
                role:
                  type: object
                  required:
                  - code
                  properties:
                    code:
                      type: string
                      minLength: 1
                      description: Code of a role. Unique in the organization.
              required:
              - account
              - role
            examples:
              Example:
                value:
                  account:
                    email: example@mydomain.com
                  role:
                    code: admin
      tags:
      - Memberships

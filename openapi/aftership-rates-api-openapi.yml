      title: RegulatoryDataItem
      x-stoplight:
        id: regulatory-data-item-v3
      description: 'A CPSC regulatory data entry associated with an item. The shape varies by `fill_mode`. Supported carriers: UPS, FedEx.'
      x-tags:
      - Primitive
      oneOf:
      - title: CpscDisclaimer
        type: object
        description: 'CPSC regulation data filled via disclaimer mode. Supported carriers: UPS, FedEx.'
        required:
        - regulation_code
        - fill_mode
        - disclaim_code
        - intended_use_code
        properties:
          regulation_code:
            type: string
            enum:
            - CPSC
            description: Regulation code identifying the applicable regulation.
          fill_mode:
            type: string
            enum:
            - disclaimer
            description: Indicates the CPSC compliance fill mode.
          disclaim_code:
            type: string
            enum:
            - A
            - B
            description: '`A` = not regulated by CPSC; `B` = no certificate needed per agency guidance.'
          intended_use_code:
            type: string
            description: Intended use of goods for customs assessment.
          intended_use_description:
            type: string
            description: Supplemental info when `intended_use_code` is `980.000`.
      - title: CpscReference
        type: object
        description: 'CPSC regulation data filled via certificate reference mode. Supported carriers: UPS, FedEx.'
        required:
        - regulation_code
        - fill_mode
        - certifier_id
        - product_id
        - version_id
        properties:
          regulation_code:
            type: string
            enum:
            - CPSC
            description: Regulation code identifying the applicable regulation.
          fill_mode:
            type: string
            enum:
            - reference
            description: Indicates the CPSC compliance fill mode.
          certifier_id:
            type: string
            description: Importer's ID in the CPSC Product Registry.
          product_id:
            type: string
            description: Product's ID in the CPSC Product Registry.
          version_id:
            type: string
            description: Version ID of the product certificate in the CPSC Product Registry.

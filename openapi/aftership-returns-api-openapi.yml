    ResolveReturn:
      content:
        application/json:
          schema:
            type: object
            properties:
              notify_customer:
                type: boolean
                x-stoplight:
                  id: d7nqczcdo05jx
    ApproveReturn:
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                notify_customer: true
                generate_label: true
                custom_label_reference: RMA#xxxxxx
            properties:
              notify_customer:
                type: boolean
                description: Whether to send a notification to the customer.
              generate_label:
                type: boolean
                description: Whether to execute the creation of labels according to the default configuration during the approval process.
              customize_label_info:
                type: object
                x-stoplight:
                  id: jn74dzcie20f8
                properties:
                  label_reference:
                    type: string
                    x-stoplight:
                      id: ig7duanv64ng8
                    description: If generate_label is set to true, this field can be used to customize the reference on the label.
                  ship_from:
                    $ref: '#/components/schemas/Address'
                    x-stoplight:
                      id: u1w48bdlm5ejr
                    description: ' If generate_label is set to true, this field is used to specify the sender''s address'
                  ship_to:
                    $ref: '#/components/schemas/Address'
                    x-stoplight:
                      id: m93henexo8kbb
                    description: ' If generate_label is set to true, this field is used to specify the receipent''s address.'
    CreateReturn:
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                order:
                  external_id: '10579097059534'
                  store:
                    platform: shopify
                    external_id: store-id
                return_items:
                - external_order_item_id: '10579097059534'
                  intended_return_quantity: 3
                  return_reason: Arrive to late
                  return_subreason: Arrive to late
                  return_reason_comment: Really late
                  shopper_uploaded_image_urls:
                  - ''
                  resolution: refund
                return_method:
                  type: retailer_label
                refund_destination: original_payment
            required:
            - order
            - return_items
            - refund_destination
            properties:
              order:
                type: object
                required:
                - external_id
                - store
                properties:
                  external_id:
                    type: string
                    description: The order ID of the original order on the e-commerce platform.
                    example: '4254002020558'
                  store:
                    type: object
                    required:
                    - platform
                    - external_id
                    properties:
                      platform:
                        type: string
                        description: The e-commerce platform where the store is located. ([See platform defination](/docs/enum/platforms.md))
                        example: shopify
                        enum:
                        - shopify
                        - sfcc
                        - automizely-private

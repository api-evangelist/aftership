      operationId: get-trackings
      description: 'Get tracking results of multiple trackings.


        <div style="visibility:hidden; height: 0">[url](../../docs/enum/additional_tracking_fields.md)[url](../../docs/enum/confidence_codes.md)[url](../../docs/enum/delivery_sub_statuses.md)[url](../../docs/enum/delivery_statuses.md)[url](../../docs/enum/slug_groups.md)[url](../../model/resource/tracking.json)[url](../../model/resource/checkpoint.json)[url](../../model/resource/courier.json)[url](../../model/resource/notification.json)[url](../../model/enum/additional_fields.v1.json)[url](../../model/enum/slug_group.v1.json)[url](../../model/enum/tag.v1.json)[url](../../reference/api.json/paths/~1trackings/get)[url](../../reference/api.json/paths/~1trackings/post)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/put)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/delete)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}~1retrack/post)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}~1mark-as-completed/post)[url](../../reference/api.json/paths/~1couriers/get)[url](../../reference/api.json/paths/~1couriers~1detect/post)[url](../../reference/api.json/paths/~1couriers~1all/get)[url](../../reference/api.json/paths/~1last_checkpoint~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}~1add/post)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}~1remove/post)

        [url](../../docs/quickstart/authentication.md)

        </div>'
      parameters:
      - schema:
          type: string
          enum:
          - application/json
          example: application/json
          default: application/json
        in: header
        name: Content-Type
        description: 'Content-Type

          '
        required: true
      - schema:
          type: string
          minimum: 1
          example: WzE3MTk5OTIwMzIzNTMsImE0NWQ5NDg5ODU4NzQzMjA5YjBjYjRlZjE3ZTBjNGVhIl0=
        in: query
        name: cursor
        description: A string representing the cursor value for the current page of results.
      - schema:
          type: integer
          minLength: 1
          maxLength: 200
          minimum: 1
          maximum: 200
          default: 100
          example: 100
        in: query
        name: limit
        description: 'Number of trackings each page contain. (Default: 100, Max: 200)'
      - schema:
          type: string
          example: RA123456789US
        in: query
        name: keyword
        description: 'Search the content of the tracking record fields: `tracking_number`, `title`, `order_id`, `customers[x].name`, `custom_fields`, `customers[x].email`, `customers[x].phone_number`'
      - schema:
          type: string
          example: RA123456789US,LE123456789US
        in: query
        name: tracking_numbers
        description: 'Tracking number of shipments. Use comma to separate multiple values (Example: RA123456789US,LE123456789US). Supports up to 50 tracking numbers.'
      - schema:
          type: string
          pattern: ^[a-z0-9-]+$
          minLength: 1
          example: usps
        in: query
        name: slug
        description: 'Unique courier code Use comma for multiple values. (Example: dhl,ups,usps)'
      - schema:
          type: integer
          example: 1
        in: query
        name: transit_time
        description: 'Total delivery time in days.


          - When the shipment is delivered: Transit time = Delivered date - Picked up date

          - When the shipment is not delivered: Transit time = Current date - Picked up date


          Value as `null` for the shipment without pickup date.'
      - schema:
          type: string
          pattern: ^[A-Z,]+$
          example: USA
        in: query
        name: origin
        description: 'Origin country/region of trackings. Use ISO Alpha-3 (three letters). Use comma for multiple values. (Example: USA,HKG)'
      - schema:
          type: string
          pattern: ^[A-Z,]+$
          example: USA
        in: query
        name: destination
        description: 'Destination country/region of trackings. Use ISO Alpha-3 (three letters). Use comma for multiple values. (Example: USA,HKG)'
      - schema:
          type: string
          enum:
          - Pending
          - InfoReceived
          - InTransit
          - OutForDelivery
          - AttemptFail
          - Delivered
          - AvailableForPickup
          - Exception
          - Expired
          example: InTransit
          pattern: ^[A-Za-z]+$
        in: query
        name: tag
        description: Current status of tracking. Values include `Pending`, `InfoReceived`, `InTransit`, `OutForDelivery`, `AttemptFail`, `Delivered`, `AvailableForPickup`, `Exception`, `Expired` (See tag definition)
      - schema:
          type: string
          example: 2013-03-15T16:41:56%2B08:00
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+[0-9]{2}:[0-9]{2}$
        in: query
        name: created_at_min
        description: 'Start date and time of trackings created. AfterShip only stores data of 120 days. Please make sure the value of the parameter is properly escaped in [URL encoding](https://en.wikipedia.org/wiki/Percent-encoding).(Defaults: 120 days ago, Example: The escaped value of 2013-03-15T16:41:56+08:00 is 2013-03-15T16:41:56%2B08:00)'
      - schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+[0-9]{2}:[0-9]{2}$
          example: 2013-03-15T16:41:56%2B08:00
        in: query
        name: created_at_max
        description: 'End date and time of trackings created. Please make sure the value of the parameter is properly escaped in [URL encoding](https://en.wikipedia.org/wiki/Percent-encoding).(Defaults: now, Example: The escaped value of 2013-04-15T16:41:56+08:00 is 2013-04-15T16:41:56%2B08:00)'
      - schema:
          type: string
          example: 2013-03-15T16:41:56%2B08:00
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+[0-9]{2}:[0-9]{2}$
        in: query
        name: updated_at_min
        description: 'Start date and time of trackings updated. Please make sure the value of the parameter is properly escaped in [URL encoding](https://en.wikipedia.org/wiki/Percent-encoding).(Example: The escaped value of 2013-03-15T16:41:56+08:00 is 2013-03-15T16:41:56%2B08:00)'
      - schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+[0-9]{2}:[0-9]{2}$
          example: 2013-03-15T16:41:56%2B08:00
        in: query
        name: updated_at_max
        description: 'End date and time of trackings updated. Please make sure the value of the parameter is properly escaped in [URL encoding](https://en.wikipedia.org/wiki/Percent-encoding).(Example: The escaped value of 2013-04-15T16:41:56+08:00 is 2013-04-15T16:41:56%2B08:00)'
      - schema:
          type: string
          example: title
          pattern: ^[a-z0-9,]+$
        in: query
        name: fields
        description: 'List of fields to include in the response. Use comma for multiple values. Available options: `title`, `order_id`, `tag`, `checkpoints`. Example: `title,order_id`'
      - schema:
          type: string
          pattern: ^[a-z,]+$
          example: 'true'
        in: query
        name: return_to_sender
        description: Select return to sender, the value should be `true` or `false`, with optional comma separated.
      - schema:
          type: string
          pattern: ^[A-Z,]+$
          example: USA
        in: query
        name: courier_destination_country_region
        description: 'Destination country/region of trackings returned by courier. Use ISO Alpha-3 (three letters). Use comma for multiple values. (Example: USA,HKG)'
      - schema:
          type: string
        in: query
        description: 'Tags you added to your shipments to help categorize and filter them easily. Use a comma to separate multiple values (Example: a,b)'
        name: shipment_tags
      - schema:
          type: string
          example: 6845a095a27a4caeb27487806f058add
        in: query
        name: order_id
        description: 'A globally-unique identifier for the order. Use comma for multiple values.(Example: 6845a095a27a4caeb27487806f058add,4845a095a27a4caeb27487806f058abc)'
      x-stoplight:
        id: jh865r66gc6hi
      tags:
      - Tracking

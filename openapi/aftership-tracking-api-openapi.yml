                    - Calculate processing time metrics in the Order-to-delivery Analytics dashboard. To ensure accurate analytics, it''s recommended to include timezone information when configuring this value

                    - Required by certain carriers to retrieve tracking information as an additional tracking field.'
                order_number:
                  type: string
                  description: A unique, human-readable identifier for the order.
                order_date:
                  type: string
                  description: Order date in YYYY-MM-DDTHH:mm:ssZ format. e.g. 2021-07-26T11:23:51-05:00
                shipment_type:
                  type: string
                  description: The carrier service type for the shipment. If you provide info for this field, AfterShip will not update it with info from the carrier.
                origin_country_region:
                  type: string
                  description: The [ISO Alpha-3](https://support.aftership.com/en/article/iso3-country-code-rlpi07/) code (3 letters) for the origin country/region. E.g. USA for the United States. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc. Also the additional field required by some carriers to retrieve the tracking info. The origin country/region of the shipment. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                  example: CHN

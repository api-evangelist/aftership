            courier_tracking_link:
              type:
              - string
              - 'null'
              x-stoplight:
                id: uv5713a4wo7qf
              description: The field contains the official tracking URL of the last-mile carrier, if available. The language parameter of this link is determined by the destination country/region and the language associated with the shipment. If the destination country/region and language data is unavailable, AfterShip will default the language parameter to "US".
              example: https://www.fedex.com/apps/fedextrack/?tracknumbers=61293150000079650812&cntry_code=US
            courier_redirect_link:
              type:
              - string

        <div style="visibility:hidden; height: 0">[url](../../docs/enum/additional_tracking_fields.md)[url](../../docs/enum/confidence_codes.md)[url](../../docs/enum/delivery_sub_statuses.md)[url](../../docs/enum/delivery_statuses.md)[url](../../docs/enum/slug_groups.md)[url](../../model/resource/tracking.json)[url](../../model/resource/checkpoint.json)[url](../../model/resource/courier.json)[url](../../model/resource/notification.json)[url](../../model/enum/additional_fields.v1.json)[url](../../model/enum/slug_group.v1.json)[url](../../model/enum/tag.v1.json)[url](../../reference/api.json/paths/~1trackings/get)[url](../../reference/api.json/paths/~1trackings/post)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/put)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}/delete)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}~1retrack/post)[url](../../reference/api.json/paths/~1trackings~1{slug}~1{tracking_number}~1mark-as-completed/post)[url](../../reference/api.json/paths/~1couriers/get)[url](../../reference/api.json/paths/~1couriers~1detect/post)[url](../../reference/api.json/paths/~1couriers~1all/get)[url](../../reference/api.json/paths/~1last_checkpoint~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}/get)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}~1add/post)[url](../../reference/api.json/paths/~1notifications~1{slug}~1{tracking_number}~1remove/post)

        [url](../../docs/quickstart/authentication.md)</div>'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - tracking_number
              properties:
                id:
                  type: string
                  x-stoplight:
                    id: 7t9fy06v5ekg7
                  description: Tracking ID that is system-generated by default and can be customized by the user when creating a tracking.
                  example: bff5a3bac79b472991a204172473a635
                  pattern: '[0-9a-zA-Z-_]{1,128}'
                tracking_number:
                  type: string
                  minLength: 1
                  description: 'Tracking number of a shipment.


                    Duplicated tracking numbers, tracking numbers with invalid tracking number format will not be accepted.


                    We only accept tracking numbers with length from 4 to 100


                    We currently support the following characters in a tracking number:


                    - A - Z

                    - 0 - 9

                    - `-` (Hyphen)

                    - . (Period)

                    - _ (Underscore)

                    - / (Slash)'
                slug:
                  type: string
                  description: Unique courier code. Get courier codes [here](https://www.aftership.com/docs/tracking/others/supported-couriers).
                title:
                  type: string
                  minLength: 1
                  description: By default this field shows the `tracking_number`, but you can customize it as you wish with any info (e.g. the order number).
                order_id:
                  type: string
                  minLength: 1
                  description: A globally-unique identifier for the order.
                custom_fields:
                  type: object
                  description: 'Custom fields that accept an object with string field. In order to protect the privacy of your customers, do not include any [personal data](https://www.aftership.com/legal/dpa#:~:text=Personal%20Data%20means,that%20natural%20person) in custom fields.


                    - Maximum charater limit for a key name: 30

                    - Maximum count for a key-value pair in a custom field object: 25

                    - Maximum value length: 512 charaters

                    - Supported value type: String only (object and array are prohibted)'
                  additionalProperties:
                    x-stoplight:
                      id: ojdlar98pvzkw
                    type: string
                order_id_path:
                  type: string
                  minLength: 1
                  description: The URL for the order in your system or store.
                language:
                  type: string
                  minLength: 1
                  description: The recipient’s language. If you set up AfterShip notifications in different languages, we use this to send the recipient tracking updates in their preferred language. Use an [ISO 639-1 Language Code](https://help.aftership.com/hc/en-us/articles/360001623287-Supported-Language-Parameters) to specify the language.
                order_promised_delivery_date:
                  type: object
                  description: The promised delivery date of the order in shipment recipient’s timezone.
                  properties:
                    promised_delivery_date:
                      type:
                      - string
                      - 'null'
                      x-stoplight:
                        id: e6hnuyahywsh7
                      description: 'The promised delivery date of the order.

                        It uses the formats:

                        - YYYY-MM-DD

                        - YYYY-MM-DDTHH:mm:ss

                        - YYYY-MM-DDTHH:mm:ssZ'
                      example: 'null'
                    promised_delivery_date_min:
                      type:
                      - string
                      - 'null'
                      x-stoplight:
                        id: uu74a45lrvb9a
                      description: "Earliest promised delivery date of the order. \nIt uses the formats:\n- YYYY-MM-DD\n- YYYY-MM-DDTHH:mm:ss\n- YYYY-MM-DDTHH:mm:ssZ"
                      example: '2022-01-02T10:00:00'
                    promised_delivery_date_max:
                      type:
                      - string
                      - 'null'
                      x-stoplight:
                        id: 55am8cjum91v6
                      description: "Latest promised delivery date of the order. \nIt uses the formats:\n- YYYY-MM-DD\n- YYYY-MM-DDTHH:mm:ss\n- YYYY-MM-DDTHH:mm:ssZ"
                      example: '2022-01-04T10:00:00'
                pickup_location:
                  type: string
                  minLength: 1
                  description: Shipment pickup location for receiver
                delivery_type:
                  type: string
                  minLength: 1
                  description: 'Shipment delivery type


                    - pickup_at_store

                    - pickup_at_courier

                    - door_to_door'
                  enum:
                  - pickup_at_store
                  - door_to_door
                  - pickup_at_courier
                pickup_note:
                  type: string
                  minLength: 1
                  description: Shipment pickup note for receiver
                tracking_account_number:
                  type: string
                  description: Additional field required by some carriers to retrieve the tracking info. The shipper’s carrier account number. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                tracking_key:
                  type: string
                  description: Additional field required by some carriers to retrieve the tracking info. A type of tracking credential required by some carriers. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                tracking_ship_date:
                  type: string
                  description: 'The date and time when the shipment is shipped by the merchant and ready for pickup by the carrier. The field supports the following formats:

                    - YYYY-MM-DD

                    - YYYY-MM-DDTHH:mm:ss

                    - YYYY-MM-DDTHH:mm:ssZ

                    The field serves two key purposes:

                    - Calculate processing time metrics in the Order-to-delivery Analytics dashboard. To ensure accurate analytics, it''s recommended to include timezone information when configuring this value

                    - Required by certain carriers to retrieve tracking information as an additional tracking field.'
                origin_country_region:
                  type: string
                  description: The [ISO Alpha-3](https://support.aftership.com/en/article/iso3-country-code-rlpi07/) code (3 letters) for the origin country/region. E.g. USA for the United States. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc. Also the additional field required by some carriers to retrieve the tracking info. The origin country/region of the shipment. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                  example: CHN
                  x-stoplight:
                    id: uq4ukyviatagh
                origin_state:
                  type: string
                  description: The state of the sender’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: Beijing
                origin_city:
                  type: string
                  description: The city of the sender’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: Beijing
                origin_postal_code:
                  type: string
                  description: The postal of the sender’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: '065001'
                origin_raw_location:
                  type: string
                  description: The sender address that the shipment is shipping from. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: Lihong Gardon 4A 2301, Chaoyang District, Beijing, BJ, 065001, CHN, China
                destination_country_region:
                  type: string
                  description: The [ISO Alpha-3](https://support.aftership.com/en/article/iso3-country-code-rlpi07/) code (3 letters) for the destination country/region. E.g. USA for the United States. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc. Also the additional field required by some carriers to retrieve the tracking info. The destination country/region of the shipment. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                  example: USA
                  x-stoplight:
                    id: ercpp086xr1q4
                destination_state:
                  type: string
                  description: The state of the recipient’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc. Also the additional field required by some carriers to retrieve the tracking info. The state/province of the recipient’s address. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                  example: New York
                destination_city:
                  type: string
                  description: The city of the recipient’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: New York City
                destination_postal_code:
                  type: string
                  description: The postal of the recipient’s address. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc. Also the additional field required by some carriers to retrieve the tracking info. The postal code of the recipient’s address. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                  example: '10001'
                destination_raw_location:
                  type: string
                  description: The shipping address that the shipment is shipping to. This can help AfterShip with various functions like tracking, carrier auto-detection and auto-correction, calculating an EDD, etc.
                  example: 13th Street, New York, NY, 10011, USA, United States
                note:
                  type: string
                  description: Text field for the note
                slug_group:
                  type: string
                  description: Slug group is a group of slugs which belong to same courier. For example, when you inpit "fedex-group" as slug_group, AfterShip will detect the tracking with "fedex-uk", "fedex-fims", and other slugs which belong to "fedex". It cannot be used with slug at the same time. ([See slug_groups definition](../../docs/enum/slug_groups.md))
                  example: fedex-group
                order_date:
                  type: string
                  description: Order date in YYYY-MM-DDTHH:mm:ssZ format. e.g. 2021-07-26T11:23:51-05:00
                order_number:
                  type: string
                  description: A unique, human-readable identifier for the order.
                shipment_type:
                  type: string
                  description: The carrier service type for the shipment. If you provide info for this field, AfterShip will not update it with info from the carrier.
                shipment_tags:
                  type: array
                  description: Used to add tags to your shipments to help categorize and filter them easily.
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 32
                courier_connection_id:
                  type: string
                  description: If you’ve connected multiple accounts for a single carrier on AfterShip, you can now use the courier_connection_id field to tell AfterShip which carrier account you’ve used to handle a shipment so we can track it. ([Get your courier connection id](https://admin.aftership.com/carrier-connection))
                location_id:
                  type: string
                  x-stoplight:
                    id: k01wm1whofqee
                  description: "The location_id refers to the place where you fulfilled the items. \n - If you provide a location_id, the system will automatically use it as the tracking's origin address. However, passing both location_id and any origin address information simultaneously is not allowed.\n- Please make sure you add your locations [here](https://admin.aftership.com/settings/locations-and-rules) before passing the location_id and verify that the location's status is active. Learn more about adding locations [here](https://support.aftership.com/en/article/manage-ship-from-locations-via-aftership-tracking-okbhj4/?bust=1702871142396)."
                shipping_method:
                  type: string
                  x-stoplight:
                    id: jk4fjgpsi4agd
                  description: The shipping_method string refers to the chosen method for delivering the package. Merchants typically offer various shipping methods to consumers during the checkout process, such as, Local Delivery, Free Express Worldwide Shipping, etc
                last_mile:
                  type: object
                  x-stoplight:
                    id: wt380ypmoandf
                  description: This field contains information about the last leg of the shipment, starting from the carrier who hands it over to the last-mile carrier, all the way to delivery. Once AfterShip detects that the shipment involves multiple legs and identifies the last-mile carrier, we will populate the last-mile carrier information in this object. Alternatively, the user can provide this information in this field to specify the last-mile carrier, which is helpful if AfterShip is unable to detect it automatically.
                  required:
                  - tracking_number
                  - slug
                  properties:
                    tracking_number:
                      type: string
                      x-stoplight:
                        id: ernzcxdt0ojen
                      description: The tracking number of the last-mile carrier.
                    slug:
                      type: string
                      x-stoplight:
                        id: g2w2ua9kisegq
                      description: The unique code of the carrier responsible for the last-mile of the shipment.  Find all the courier slugs [here](https://www.aftership.com/docs/tracking/others/supported-couriers).
                customers:
                  type: array
                  x-stoplight:
                    id: vk85cip3yx6oc
                  description: The field contains the customer information associated with the tracking. A maximum of three customer objects are allowed.
                  items:
                    x-stoplight:
                      id: m9bfoktl2mdvs
                    type: object
                    properties:
                      role:
                        type: string
                        x-stoplight:
                          id: uobulr8235hho
                        minLength: 1
                        description: The  role of the customer, indicating whether the customer is  an individual or a company.
                      name:
                        type: string
                        x-stoplight:
                          id: cctz1o8tbasrz
                        minLength: 1
                        description: Customer name associated with the tracking.
                      phone_number:
                        type: string
                        x-stoplight:
                          id: jmxhj2gk8gc40
                        description: 'The phone number(s) to receive SMS notifications. Phone numbers should begin with a `+` sign and include the area code.

                          '
                      email:
                        type: string
                        x-stoplight:
                          id: c6ermxud9jvbq
                        description: Email address(es) to receive email notifications.
                      language:
                        type: string
                        x-stoplight:
                          id: kwc8l46fu3dji
                        description: The preferred language of the customer. If you have set up AfterShip notifications in different languages, we use this to send the tracking updates to the customer in their preferred language.
                      id:
                        type: string
                        x-stoplight:
                          id: d4kcstmrid8wp
                        description: The customer's identifier on the merchant or platform (for example, Shopify) side.
                shipment_direction:
                  type: string
                  x-stoplight:
                    id: m2shpdrcrt8fw
                  enum:
                  - forward
                  - return
                  description: 'Indicates the business direction of the shipment in the e-commerce fulfillment lifecycle.


                    Possible values:

                    - `forward`: A forward (outbound-to-customer) shipment created for order fulfillment.

                    - `return`: A return (customer-to-merchant) shipment created for after-sales return or exchange.


                    When provided, this field gives AfterShip additional context about the shipment''s intent, enabling more accurate status identification.'
            examples:
              create-tracking:
                value:
                  slug: dhl
                  tracking_number: '123456789'
                  title: Title Name
                  customers:
                  - role: buyer
                    name: Steve Young
                    email: email@yourdomain.com
                    phone_number: '+18555072501'
                    language: en
                  last_mile:
                    slug: ups
                    tracking_number: '61293150000079650811'
                  tracking_ship_date: '2025-01-09T20:00:00+08:00'
                  order_id: ID 1234

                  description: Additional field required by some carriers to retrieve the tracking info. A type of tracking credential required by some carriers. Refer to our article on [additional tracking fields](../../docs/enum/additional_tracking_fields.md) for more details.
                tracking_ship_date:
                  type: string
                  description: 'The date and time when the shipment is shipped by the merchant and ready for pickup by the carrier. The field supports the following formats:

                    - YYYY-MM-DD

                    - YYYY-MM-DDTHH:mm:ss

                    - YYYY-MM-DDTHH:mm:ssZ


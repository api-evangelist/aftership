  api: AfterShip Tracking API
  example: '1406096275'
  description: Unix timestamp when the rate limit resets.
- name: X-RateLimit-Limit
  api: AfterShip Tracking API
  example: '20'
  description: Rate limit ceiling for the endpoint.
- name: X-RateLimit-Remaining
  api: AfterShip Tracking API
  example: '19'
  description: Requests left in the current window.
- name: rateLimit-reset
  api: AfterShip Shipping API
  example: '1406096275'
  description: Unix timestamp when the rate limit resets.
- name: rateLimit-limit
  api: AfterShip Shipping API
  example: '10'
  description: Per-organization per-second ceiling.
- name: rateLimit-remaining
  api: AfterShip Shipping API
  example: '9'
  description: Requests left in the 1-second window.
- name: ratelimit-limit
  api: AfterShip MCP gateway
  example: '100000'
  description: Observed on a live 429 from mcp.aftership.com, 2026-08-27.
  observed: true
- name: ratelimit-remaining
  api: AfterShip MCP gateway
  example: '0'
  observed: true
- name: retry-after
  api: AfterShip MCP gateway
  example: '31090'
  description: Seconds until the window resets.
  observed: true
